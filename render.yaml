# Render Infrastructure as Code Blueprint
# https://render.com/docs/blueprint-spec

services:
  # 1. Django REST API Web Service
  - type: web
    name: pulsewatch-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn pulsewatch.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /api/overview/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://sentiro.xyz"
      - key: FEEDBACK_RECEIVE_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BACHS_API_KEY
        sync: false
      - key: BACHS_WEBHOOK_SECRET
        sync: false
      # Optional: To connect Render's Free PostgreSQL, uncomment:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: pulsewatch-db
      #     property: connectionString

  # 2. Continuous Check Worker Daemon (Optional Background Worker)
